[package]
name = "songbird-tui"
version = "1.0.0"
edition = "2021"
description = "A terminal music player"
license = "ISC"
description=""
homepage
repository

[[bin]]
name = "songbird"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
lofty = "0.22"
rand = "0.9"
ratatui = "0.29"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
interprocess = "2.4"
walkdir = "2.5"

[target.'cfg(windows)'.dependencies]
named_pipe = "0.4"
